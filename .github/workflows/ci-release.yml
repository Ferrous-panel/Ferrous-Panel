name: CI & Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build SPA (Vite) + Test & Release Rust Workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (build static frontend dist/ for rust-embed)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies & build dist/
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
          npm run build
          npx tsc --noEmit

      - name: Setup Rust stable (1.89+) toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install ARM64 cross-linker for aarch64 release binary
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Cargo build --release x86_64 (embeds dist/ via rust-embed)
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Cargo build --release aarch64 (embeds dist/ via rust-embed)
        if: github.event_name == 'push'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target aarch64-unknown-linux-gnu

      - name: Prepare release artifacts (prebuilt dist/ + multi-arch binaries + SHA256SUMS)
        if: github.event_name == 'push'
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/ferrous-dist.tar.gz -C dist .
          cp target/x86_64-unknown-linux-gnu/release/ferrous-panel release-artifacts/ferrous-panel-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/ferrousx-bin release-artifacts/ferrousx-bin-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/ferrousx-ctl release-artifacts/ferrousx-ctl-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/ferrous-panel release-artifacts/ferrous-panel-linux-aarch64
          cp target/aarch64-unknown-linux-gnu/release/ferrousx-bin release-artifacts/ferrousx-bin-linux-aarch64
          cp target/aarch64-unknown-linux-gnu/release/ferrousx-ctl release-artifacts/ferrousx-ctl-linux-aarch64
          cp install.sh update.sh uninstall.sh release-artifacts/
          (cd release-artifacts && sha256sum ferrous-dist.tar.gz ferrous-panel-linux-* ferrousx-bin-linux-* ferrousx-ctl-linux-* > SHA256SUMS.txt)

      - name: Publish GitHub Release (powers 1-command install.sh)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.0' }}
          name: "FerrousPanel ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.5.0 (Latest)' }}"
          make_latest: "true"
          files: |
            release-artifacts/ferrous-dist.tar.gz
            release-artifacts/ferrous-panel-linux-x86_64
            release-artifacts/ferrousx-bin-linux-x86_64
            release-artifacts/ferrousx-ctl-linux-x86_64
            release-artifacts/ferrous-panel-linux-aarch64
            release-artifacts/ferrousx-bin-linux-aarch64
            release-artifacts/ferrousx-ctl-linux-aarch64
            release-artifacts/SHA256SUMS.txt
            release-artifacts/install.sh
            release-artifacts/update.sh
            release-artifacts/uninstall.sh
