name: CI & Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build SPA (Vite) + Test & Release Rust Workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (build static frontend dist/ for rust-embed)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies & build dist/
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx tsc --noEmit

      - name: Setup Rust 1.85+ toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Cargo build --release (embeds dist/ via rust-embed)
        run: cargo build --release --workspace

      - name: Prepare release artifacts & SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-artifacts
          cp target/release/ferrous-panel release-artifacts/ferrous-panel-linux-x86_64
          cp target/release/ferrousx-bin release-artifacts/ferrousx-bin-linux-x86_64
          (cd release-artifacts && sha256sum ferrous-panel-linux-x86_64 ferrousx-bin-linux-x86_64 > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ferrous-panel-linux-x86_64
            release-artifacts/ferrousx-bin-linux-x86_64
            release-artifacts/SHA256SUMS.txt
