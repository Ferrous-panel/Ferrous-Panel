[workspace]
resolver = "2"
members = [
    "crates/ferrous-panel",
    "crates/ferrousx",
]
exclude = ["_archive"]

[workspace.package]
version = "2.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ferrous-panel/Ferrous-Panel"
homepage = "https://github.com/Ferrous-panel/Ferrous-Panel"
documentation = "https://github.com/Ferrous-panel/Ferrous-Panel#readme"
readme = "README.md"
keywords = ["vps", "control-panel", "ubuntu", "actix-web", "rustls"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[workspace.dependencies]
# Core Control Plane & HTTP Server (ferrous-panel)
actix-web = "4.9"
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
mime_guess = "2.0"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sysinfo = "0.33"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# FerrousX HTTP/1.1 + HTTP/2 + TLS + FastCGI Web Server (ferrousx)
fastcgi-client = "0.9"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
