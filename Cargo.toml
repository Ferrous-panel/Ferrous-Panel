[workspace]
resolver = "2"
members = [
    "crates/ferrous-core",
    "crates/ferrous-panel",
    "crates/ferrousx",
]
exclude = ["_archive"]

[workspace.package]
version = "2.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ferrous-panel/Ferrous-Panel"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
