[package]
name = "ferrous-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Security primitives, validated domain newtypes, allowlisted system command runner, and Argon2id auth core for FerrousPanel."

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "sync", "fs"] }
