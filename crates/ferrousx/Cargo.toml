[package]
name = "ferrousx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FerrousX MVP — pure Rust HTTP/1.1 + HTTP/2 + TLS (SNI/ALPN) web server and reverse proxy."

[[bin]]
name = "ferrousx-bin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fastcgi-client = "0.9"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
mime_guess = "2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
